name: Build and Deploy Staging (Backend)

on:
  push:
    branches: [staging]

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/dwi-wahyu/canteeners-backend:cache-staging
          cache-to: type=registry,ref=ghcr.io/dwi-wahyu/canteeners-backend:cache-staging,mode=max
          push: true
          tags: ghcr.io/dwi-wahyu/canteeners-backend:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Deploy via SSH
        timeout-minutes: 20

        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 20m
          command_timeout: 15m
          script: |
            export XDG_RUNTIME_DIR=/run/user/$(id -u)

            podman login ghcr.io -u dwi-wahyu -p ${{ secrets.GHCR_TOKEN }}

            # Ganti dengan path folder root project Anda di server
            cd /var/www/canteeners 

            # Pull image terbaru menggunakan Podman
            podman pull ghcr.io/dwi-wahyu/canteeners-backend:staging

            # Restart Staging Pod menggunakan native kube play
            podman kube down /var/www/canteeners/podman/staging/pod.yaml
            podman kube play /var/www/canteeners/podman/staging/pod.yaml
